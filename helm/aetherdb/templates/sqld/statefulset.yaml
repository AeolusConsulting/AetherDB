{{- if .Values.sqld.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-sqld
  labels:
    {{- include "aetherdb.labels" . | nindent 4 }}
    app.kubernetes.io/component: sqld
spec:
  serviceName: {{ .Release.Name }}-sqld
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: sqld
      {{- include "aetherdb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: sqld
        {{- include "aetherdb.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: sqld
          image: ghcr.io/tursodatabase/libsql-server:latest
          command: [sqld, --http-listen-addr=0.0.0.0:8080, --grpc-listen-addr=0.0.0.0:5001]
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 5001
              name: grpc
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.sqld.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/sqld
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.sqld.storage }}
{{- end }}
