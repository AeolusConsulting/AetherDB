{{- if .Values.sqld.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-sqld
  labels:
    {{- include "aetherdb.labels" . | nindent 4 }}
    app.kubernetes.io/component: sqld
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      name: http
    - port: 5001
      targetPort: grpc
      name: grpc
  selector:
    app.kubernetes.io/component: sqld
    {{- include "aetherdb.selectorLabels" . | nindent 4 }}
{{- end }}
