apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-analytics-consumer
  labels:
    {{- include "aetherdb.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-consumer
spec:
  replicas: {{ .Values.analyticsConsumer.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: analytics-consumer
      {{- include "aetherdb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: analytics-consumer
        {{- include "aetherdb.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: analytics-consumer
          image: "{{ .Values.global.image.repository }}/analytics-consumer:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secrets
          resources:
            {{- toYaml .Values.analyticsConsumer.resources | nindent 12 }}
