{{- if .Values.graphWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-graph-worker
  labels:
    {{- include "aetherdb.labels" . | nindent 4 }}
    app.kubernetes.io/component: graph-worker
spec:
  replicas: {{ .Values.graphWorker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: graph-worker
      {{- include "aetherdb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: graph-worker
        {{- include "aetherdb.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: graph-worker
          image: "{{ .Values.global.image.repository }}/graph-worker:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secrets
          resources:
            {{- toYaml .Values.graphWorker.resources | nindent 12 }}
{{- end }}
