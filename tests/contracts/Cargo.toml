[package]
name = "contract_tests"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aetherdb-domain = { path = "../../crates/domain" }
aetherdb-config = { path = "../../crates/config" }
aetherdb-storage = { path = "../../crates/storage" }
aetherdb-vector = { path = "../../crates/vector" }
aetherdb-events = { path = "../../crates/events" }
aetherdb-messaging = { path = "../../crates/messaging" }
aetherdb-telemetry = { path = "../../crates/telemetry" }
aetherdb-api-gateway = { path = "../../apps/api-gateway" }
aetherdb-embedding-worker = { path = "../../apps/embedding-worker" }
aetherdb-analytics-consumer = { path = "../../apps/analytics-consumer" }
aetherdb-duckdb-exporter = { path = "../../apps/duckdb-exporter" }

tokio = { version = "1.40", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
testcontainers = "0.23"
async-trait = "0.1"
libc = "0.2"
metrics = "0.24"
futures = "0.3"
once_cell = "1"
tempfile = "3"
serde_yaml = "0.9"
sha2 = "0.10"

[[test]]
name = "c1_workspace"
path = "c1_workspace.rs"

[[test]]
name = "c1_files"
path = "c1_files.rs"

[[test]]
name = "c1_app_lifecycle"
path = "c1_app_lifecycle.rs"

[[test]]
name = "c2_gateway"
path = "c2_gateway.rs"

[[test]]
name = "c3_storage"
path = "c3_storage.rs"

[[test]]
name = "c4_vector"
path = "c4_vector.rs"

[[test]]
name = "c5_messaging"
path = "c5_messaging.rs"

[[test]]
name = "c6_embedding_worker"
path = "c6_embedding_worker.rs"

[[test]]
name = "c7_analytics"
path = "c7_analytics.rs"

[[test]]
name = "c8_duckdb_export"
path = "c8_duckdb_export.rs"

[[test]]
name = "c9_telemetry"
path = "c9_telemetry.rs"

[[test]]
name = "c10_compose"
path = "c10_compose.rs"

[[test]]
name = "c12_corpus"
path = "c12_corpus.rs"

[[test]]
name = "c11_replication"
path = "c11_replication.rs"

[[test]]
name = "config"
path = "config.rs"
