global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:9090"]

  - job_name: embedding-worker
    static_configs:
      - targets: ["embedding-worker:9090"]

  - job_name: analytics-consumer
    static_configs:
      - targets: ["analytics-consumer:9090"]

  - job_name: graph-worker
    static_configs:
      - targets: ["graph-worker:9090"]
