[package]
name = "aetherdb-analytics-consumer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "analytics-consumer"
path = "src/main.rs"

[dependencies]
aetherdb-config = { path = "../../crates/config" }
aetherdb-telemetry = { path = "../../crates/telemetry" }
aetherdb-domain = { path = "../../crates/domain" }
aetherdb-events = { path = "../../crates/events" }
aetherdb-messaging = { path = "../../crates/messaging" }
rdkafka = { version = "0.36", features = ["cmake-build", "zstd"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
metrics = "0.24"
